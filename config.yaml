# ============================================================================
#  AutoScraper configuration.  Two demo targets from scraping sandboxes
#  (books.toscrape.com, quotes.toscrape.com) - built for practice, safe to scrape.
#  To scrape your own site: copy a target block, change the URL + selectors,
#  and test with:  python main.py preview -t <name>
# ============================================================================
project: demo                 # names the database file: data/demo.db
output_dir: data              # relative to this file
log_level: INFO
exports: [csv, xlsx, json]    # written to data/exports/<target>.<ext>

request:
  delay_seconds: 1.0          # be polite: minimum gap between requests
  jitter: 0.5
  timeout: 20
  retries: 3                  # retried with exponential backoff on 429/5xx/timeouts
  backoff: 2.0
  respect_robots: true        # keep this on unless you own the site
  use_playwright: false       # true = headless Chromium for JavaScript-rendered pages
  user_agent: "AutoScraper/1.0 (contact: you@example.com)"   # identify yourself
  # proxy: "http://user:pass@host:port"
  # headers: {Accept-Language: "en-IN,en;q=0.9"}

schedule:                     # used by:  python main.py schedule
  enabled: true
  interval_minutes: 360       # every 6 hours...
  # cron: "0 8 * * *"         # ...or a cron expression (overrides interval_minutes)
  timezone: Asia/Kolkata

# webhook_url: https://hooks.slack.com/services/XXX   # alerts on failed/empty runs
#                                                    # (or set env var SCRAPER_WEBHOOK_URL)

targets:
  # ---- follows the "next" button -------------------------------------------
  - name: books
    start_url: https://internshala.com/blog/top-it-companies-in-indore/
    max_pages: 3
    item_selector: article.product_pod          # one match = one row
    next_page: {selector: li.next a}            # pagination via the next link
    dedupe_on: [url]                            # unique key; drives new/updated detection
    fields:
      title:        {selector: h3 a, attr: title}
      price:        {selector: .price_color, type: price}      # "£51.77" -> 51.77
      rating:       {selector: p.star-rating, attr: class, type: rating}   # "Three" -> 3
      availability: {selector: .availability}
      url:          {selector: h3 a, attr: href, absolute: true}

  # ---- URL pattern pagination + multi-value field --------------------------
  - name: quotes
    url_template: https://quotes.toscrape.com/page/{page}/
    start_page: 1
    max_pages: 3                                # stops earlier if a page has no items
    item_selector: div.quote
    dedupe_on: [text]
    fields:
      text:   {selector: span.text}
      author: {selector: small.author}
      tags:   {selector: a.tag, multiple: true}                  # joined with " | "
