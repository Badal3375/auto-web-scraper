# ============================================================================
#  AutoScraper & Website Intelligence configuration.
# ============================================================================
project: demo                 # names the database file: data/demo.db
output_dir: data              # relative to this file
log_level: INFO
exports: [csv, xlsx, json]    # written to data/exports/<target>.<ext>

request:
  delay_seconds: 1.0          # be polite: minimum gap between requests
  jitter: 0.5
  timeout: 20
  retries: 3                  # retried with exponential backoff on 429/5xx/timeouts
  backoff: 2.0
  respect_robots: true        # keep this on unless you own the site
  use_playwright: false       # true = headless Chromium for JavaScript-rendered pages
  user_agent: "AutoScraper/1.0 (contact: you@example.com)"

schedule:                     # used by:  python main.py schedule
  enabled: true
  interval_minutes: 360
  timezone: Asia/Kolkata

# ============================================================================
#  URLs for Company, HR, and Email Analysis:
#  Analyze with: python main.py analyze <url> or in the Streamlit Dashboard
# ============================================================================
analysis_urls:
  - https://internshala.com/blog/top-it-companies-in-indore/
  - https://example.com

# ============================================================================
#  Scraping Targets (Structured repeat-element extraction)
# ============================================================================
targets:
  # Target for Website / Company Analysis
  - name: my_company
    start_url: https://internshala.com/blog/top-it-companies-in-indore/
    max_pages: 3

  # Demo Target 1: Books sandbox
  - name: books
    start_url: https://books.toscrape.com/catalogue/page-1.html
    max_pages: 3
    item_selector: article.product_pod          # one match = one row
    next_page: {selector: li.next a}            # pagination via the next link
    dedupe_on: [url]                            # unique key; drives new/updated detection
    fields:
      title:        {selector: h3 a, attr: title}
      price:        {selector: .price_color, type: price}
      rating:       {selector: p.star-rating, attr: class, type: rating}
      availability: {selector: .availability}
      url:          {selector: h3 a, attr: href, absolute: true}

  # Demo Target 2: Quotes sandbox
  - name: quotes
    url_template: https://quotes.toscrape.com/page/{page}/
    start_page: 1
    max_pages: 3
    item_selector: div.quote
    dedupe_on: [text]
    fields:
      text:   {selector: span.text}
      author: {selector: small.author}
      tags:   {selector: a.tag, multiple: true}